<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><style>
@font-face { font-family: 'InterL'; src: local('Inter'); }

.floor { position: absolute; left: -50%; right: -50%; bottom: -6%; height: 34%; background-image: linear-gradient(rgba(34,211,238,.45) 1px, transparent 1px), linear-gradient(90deg, rgba(167,139,250,.45) 1px, transparent 1px); background-size: 48px 48px; transform: perspective(380px) rotateX(62deg); transform-origin: bottom; -webkit-mask-image: linear-gradient(to top, #000, transparent 85%); }

.slogan { color: #c7cbef; }
.qrcard { background: #fff; border-radius: 28px; padding: 6px; box-shadow: 0 0 0 4px rgba(167,139,250,.9), 0 0 0 10px rgba(34,211,238,.35), 0 0 70px rgba(139,92,246,.7); position: relative; }

.qrcard .corner { position: absolute; width: 38px; height: 38px; border: 5px solid #22d3ee; }
.c1 { top: -16px; left: -16px; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
.c2 { top: -16px; right: -16px; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
.c3 { bottom: -16px; left: -16px; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
.c4 { bottom: -16px; right: -16px; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
.scan { font-weight: 800; letter-spacing: .04em; color: #fff; }
.url { font-family: 'DejaVu Sans Mono', monospace; color: #a5f3fc; background: rgba(7,10,26,.7); border: 1px solid rgba(34,211,238,.45); border-radius: 999px; padding: 8px 18px; display: inline-block; }
.thumbs { display: grid; gap: 12px; }
.thumb { position: relative; border-radius: 16px; overflow: hidden; border: 2px solid rgba(167,139,250,.5); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb span { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); background: rgba(7,10,26,.82); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 3px 12px; font-weight: 800; font-size: 13px; letter-spacing: .08em; white-space: nowrap; }
.pills { display: flex; flex-wrap: wrap; gap: 10px; }
.pill { padding: 8px 16px; border-radius: 999px; font-weight: 700; font-size: 16px; background: rgba(139,92,246,.18); border: 1px solid rgba(167,139,250,.5); }
.foot { color: #9aa0c8; font-size: 14px; }
.foot b { font-weight: 800; }
.foot sup { font-size: .65em; }
